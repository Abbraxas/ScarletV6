start_1 : "{0} ιs ησᴡ 𝐎‌ηʟɪηє 𝐀‌ηᴅ 𝐎‌ᴘєꝛᴧᴛɪσηᴧʟ.\n\n<b>✫ 𝐔‌ᴘᴛɪϻє :</b> {1}"
start_2 : "<blockquote><b>✦ Ꭲʜᴧηᴋ 𝐘‌συ {0}, 𝐅‌σꝛ 𝚺ηᴛєꝛɪηɢ 𝐈η 𝛅ᴄᴧꝛʟєᴛ 𝐑‌єᴧʟϻ.</b></blockquote>\n<blockquote expandable><b>➻ 𝐏‌ꝛєsєηᴛɪηɢ {1} — Λη 𝐈ϻϻєꝛsɪᴠє 𝛅σηɪᴄ 𝚺xᴘєꝛɪєηᴄє.\n➤ 𝐄‌ηɢɪηєєꝛєᴅ 𝐅‌σꝛ 𝐅‌ʟυɪᴅ 𝐕‌σɪᴄє 𝛅ᴛꝛєᴧϻɪηɢ Ληᴅ 𝐔‌ηɪηᴛєꝛꝛυᴘᴛєᴅ 𝐏‌ʟᴧʏʙᴧᴄᴋ.\n➤ 𝐑‌єᴘʟɪᴄᴧᴛє Ꭲʜє 𝚺ηᴛɪꝛє 𝚺ᴄσsʏsᴛєϻ 𝐈ηᴛσ 𝐘‌συꝛ 𝐎‌ᴡη 𝐈ᴅєηᴛɪᴛʏ 𝐖‌ɪᴛʜ 𝐉‌υsᴛ Λ 𝐅‌єᴡ Ꭲᴧᴘs.\n•── ⋅ ⋅ ⋅ ──────── ⋅ • ⋅ ──────── ⋅ ⋅ ⋅ ──• \n➤ 𝐎‌ᴘєη Ꭲʜє 𝐇‌єʟᴘ 𝐏‌ᴧηєʟ Ꭲσ 𝐔‌ηᴄσᴠєꝛ 𝚺ᴠєꝛʏ 𝐂‌ᴧᴘᴧʙɪʟɪᴛʏ.</b></blockquote>"
start_3 : "𝐆‌ꝛєєᴛɪηɢs {0},\n𝐀‌ʟʟσᴡ 𝐌‌є 𝐓‌σ 𝐏‌ꝛєsєηᴛ {1}.\n\n𝐀‌ᴘᴘꝛєᴄɪᴧᴛє 𝐘‌συꝛ 𝐈‌ηᴠɪᴛᴧᴛɪση 𝐓‌σ {2}.\n{3} 𝐈‌s 𝐍‌σᴡ 𝐏‌ꝛɪϻєᴅ 𝐓‌σ 𝐄‌ʟєᴠᴧᴛє 𝐘‌συꝛ 𝐕‌σɪᴄє 𝐂‌ʜᴧᴛ 𝐄‌xᴘєꝛɪєηᴄє."
start_4 : "✧ <b>𝛅υᴘєꝛɢꝛσυᴘ 𝐑‌єǫυɪꝛєᴅ</b> ✧\n\n𝐏‌ʟєᴧsє 𝐔‌ᴘɢꝛᴧᴅє 𝐘‌συꝛ <b>𝐆‌ꝛσυᴘ</b> 𝐈ηᴛσ 𝐀‌ <b>𝛅υᴘєꝛɢꝛσυᴘ</b> 𝐀‌ηᴅ 𝐈‌ηᴠɪᴛє 𝐌‌є 𝐀‌ɢᴧɪη.\n\n<b>𝐇‌σᴡ 𝐓‌σ 𝐔‌ᴘɢꝛᴧᴅє?</b>\n- 𝐄‌ηᴧʙʟє <b>𝐕‌ɪsɪʙʟє 𝐂‌ʜᴧᴛ 𝐇‌ɪsᴛσꝛʏ</b> 𝐅‌σꝛ 𝐓‌ʜє 𝐆‌ꝛσυᴘ."
start_5 : "<b>↝ 𝐁‌ʟᴧᴄᴋʟɪsᴛєᴅ 𝐂‌ʜᴧᴛ ↜</b>\n\n𝐓‌ʜɪs 𝐂‌ʜᴧᴛ 𝐈‌s 𝐂‌υꝛꝛєηᴛʟʏ 𝐑‌єsᴛꝛɪᴄᴛєᴅ 𝐈‌η {0} 𝐃‌ᴧᴛᴧʙᴧsє.\n𝐂‌σηᴛᴧᴄᴛ 𝐀‌ <a href={1}>𝐒‌υᴅσ 𝐀‌ᴅϻɪη</a> 𝐓‌σ 𝐑‌єsᴛσꝛє 𝐀‌ᴄᴄєss, 𝐎‌ꝛ 𝐕‌ɪsɪᴛ 𝐎‌υꝛ <a href={2}>𝐒‌υᴘᴘσꝛᴛ 𝐂‌єηᴛєꝛ.</a>"
